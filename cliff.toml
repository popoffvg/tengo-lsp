# git-cliff configuration — https://git-cliff.org/docs/configuration
# Changelog is generated from Conventional Commits (feat:, fix:, …).

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
This file is generated by [git-cliff](https://github.com/orhun/git-cliff) from
[Conventional Commits](https://www.conventionalcommits.org).
"""
# Template for the changelog body — Tera syntax.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
# Parse commits according to the Conventional Commits spec.
conventional_commits = true
# Drop commits that don't follow the spec from the changelog.
filter_unconventional = true
# Don't split a commit into multiple entries on newlines.
split_commits = false
# Tidy up commit messages before grouping.
commit_preprocessors = [
  # Link issue/PR numbers to GitHub.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/orhun/git-cliff/issues/${2}))" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build & CI" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore|^style", group = "<!-- 7 -->Miscellaneous" },
  { body = ".*security", group = "<!-- 8 -->Security" },
  { message = "^revert", group = "<!-- 9 -->Revert" },
]
# Protect breaking changes from being skipped.
protect_breaking_commits = true
# Only include commits that match a parser above.
filter_commits = false
# Process tags matching this glob.
tag_pattern = "v[0-9]*"
# Order releases newest-first.
sort_commits = "oldest"
