name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  changelog:
    name: Generate release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog for this tag
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create release with notes
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}

  build:
    name: ${{ matrix.asset_name }}
    needs: changelog
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: tengo-lsp-darwin-aarch64
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: tengo-lsp-darwin-x86_64
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: tengo-lsp-linux-x86_64
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_name: tengo-lsp-linux-aarch64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: tengo-lsp-windows-x86_64
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tengo-lsp dist/
          tar -czf ${{ matrix.asset_name }}.tar.gz -C dist tengo-lsp

      - name: Package (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/${{ matrix.target }}/release/tengo-lsp.exe dist/
          Compress-Archive -Path dist/tengo-lsp.exe -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.${{ matrix.archive_ext }}

  tap:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate formula and push to tap
        env:
          # GH_TOKEN reads this repo's release assets (script uses `gh release download`).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT (popoffvg account) with contents:write on popoffvg/homebrew-tengo-lsp.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/popoffvg/homebrew-tengo-lsp.git" tap
          mkdir -p tap/Formula
          scripts/gen-homebrew-formula.sh "$version" > tap/Formula/tengo-lsp.rb
          cd tap
          if git diff --quiet; then
            echo "Formula already up to date for v${version}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tengo-lsp.rb
          git commit -m "chore: update tengo-lsp to v${version}"
          git push
